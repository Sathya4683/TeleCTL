name: Deploy frontend

# Deploys the Next.js frontend in `web/` to Vercel via the official Vercel CLI.
# Vercel's recommended flow:
#   vercel pull    → fetches project config + env into .vercel/
#   vercel build   → runs the Next.js build with Vercel's pipeline
#   vercel deploy --prebuilt → uploads the already-built artifacts
#
# Triggers:
#   • push to main        → production deploy (when `web/**` changes)
#   • pull_request        → preview deploy (commented with the URL)
#   • workflow_dispatch   → manual deploy (production)
#
# Required secrets (configure under Settings → Secrets → Actions):
#   VERCEL_TOKEN         —  https://vercel.com/account/tokens
#
# After creating the token, run `vercel link` once locally from web/ so the
# project is linked to your account. `.vercel/project.json` is gitignored;
# `vercel pull` re-creates it on every run.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-frontend.yaml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

# Don't run two deploys at once for the same branch. cancel-in-progress:
# true on PRs (latest preview wins), false on main (let prod runs finish).
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # so the bot can comment the preview URL

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull down project settings so vercel build / deploy know which
      # project on your Vercel account to attach to. Reads/writes .vercel/.
      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Catch lint errors before paying for a build.
      - name: Lint + type-check
        run: npm run lint

      # Use Vercel's build pipeline (not raw `next build`) so the output
      # matches what Vercel would produce on its own infrastructure.
      - name: Build
        run: vercel build ${{ github.event_name == 'pull_request' && '' || '--prod' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Production on push-to-main, preview on PRs. We capture stdout so
      # we can grep the deployed URL out for the PR comment.
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          else
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          fi
          printf '%s\n' "$DEPLOY_OUTPUT"
          # Vercel prints multiple URLs (inspect, temporary, final aliased).
          # Take the last one — that's the production URL worth linking.
          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" \
            | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' \
            | tail -n1)
          echo "preview-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: vercel-preview
          message: |
            ✅ Vercel preview deployed.

            **URL:** ${{ steps.deploy.outputs.preview-url }}

      - name: Log deployment
        if: github.event_name != 'pull_request'
        run: |
          echo "Production deploy complete: ${{ steps.deploy.outputs.preview-url }}"
