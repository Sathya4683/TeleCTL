name: Deploy frontend

# Deploys the Next.js frontend in `web/` to Vercel.
#
# Triggers:
#   • push to main        → production deploy (when `web/**` changes)
#   • pull_request        → preview deploy (commented with the URL)
#   • workflow_dispatch   → manual deploy (production)
#
# Required secrets (configure under Settings → Secrets → Actions):
#   VERCEL_TOKEN         —  https://vercel.com/account/tokens
#   VERCEL_ORG_ID        —  `vercel link` writes this to web/.vercel/project.json
#   VERCEL_PROJECT_ID    —  same source
#
# Optional:
#   VERCEL_TEAM_SLUG     —  required only if the project is in a team,
#                           not a personal account

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-frontend.yaml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

# Don't run two deploys at once for the same branch. cancel-in-progress:
# true on PRs (latest preview wins), false on main (let prod runs finish).
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # so the bot can comment the preview URL

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # `next build` is what Vercel itself runs, so we run it here to
      # catch type / lint / build errors before hitting their API.
      - name: Lint + type-check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Production deploy on push-to-main, preview on PRs.
          vercel-args: ${{ github.event_name == 'pull_request' && '--yes' || '--prod --yes' }}
          working-directory: web

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: vercel-preview
          message: |
            ✅ Vercel preview deployed.

            **URL:** ${{ steps.deploy.outputs.preview-url }}

      - name: Log deployment
        if: github.event_name != 'pull_request'
        run: |
          echo "Production deploy complete: ${{ steps.deploy.outputs.preview-url }}"