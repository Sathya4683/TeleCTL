[project]
name = "wactl"
version = "0.1.0"
description = "Production-grade WhatsApp Cloud API automation platform. Lambda webhook → plugin command registry → sync inline / async via SQS → EC2 worker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "WACTL" },
]
keywords = ["whatsapp", "lambda", "sqs", "aws", "terraform", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Typing :: Typed",
]

# ============================================================================
# Runtime dependencies
# ============================================================================
dependencies = [
    # --- HTTP client (async, timeouts, hooks for testing) ---
    "httpx>=0.28.1,<1.0",

    # --- AWS SDK + types ---
    "boto3[crt]>=1.43.66,<2.0",
    "botocore>=1.43.66,<2.0",

    # --- Data modeling + settings ---
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",

    # --- Structured logging ---
    "structlog>=26.1.0,<27.0",

    # --- Retry / backoff (used for WhatsApp 429 responses) ---
    "tenacity>=9.1.4,<10.0",

    # --- Document / image conversion ---
    "pdf2docx>=0.5.13,<1.0",
    "pymupdf>=1.28.2,<2.0",
    "pypdf>=6.15.0,<7.0",
    "Pillow>=12.3.0,<13.0",
    "markdownify>=1.2.3,<2.0",
    "beautifulsoup4>=4.15.0,<5.0",
    "lxml>=6.1.1,<7.0",

    # --- Audio (audiobook service) ---
    "pydub>=0.25.1,<1.0",

    # --- LLM (Gemini) ---
    "google-genai>=2.17.0,<3.0",

    # --- .env loading for local development ---
    "python-dotenv>=1.2.2,<2.0",
]

# ============================================================================
# Dependency groups (development tooling + worker extras)
# ============================================================================
[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5.0,<6.0",
    "freezegun>=1.5,<2.0",
    "boto3-stubs[dynamodb,s3,sqs,secretsmanager]>=1.35,<2.0",
    "mypy-boto3-secretsmanager>=1.35,<2.0",
    "types-beautifulsoup4>=4.12,<5.0",
    "types-PyYAML>=6.0,<7.0",
    "coverage>=7.6,<8.0",
]
# Worker shares the runtime deps above; no extras required.

[project.urls]
"Source" = "https://example.com/wactl"
"Documentation" = "docs/SETUP.md"

# ============================================================================
# src/ layout — importable as `wactl.*` from any consumer (Lambda, worker)
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wactl"]

# ============================================================================
# Ruff (lint + format)
# ============================================================================
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Default + opinionated additions. Per-phase, may add more.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # simplify
    "ASYNC",# async correctness
    "RUF",  # ruff-specific rules
    "C4",   # comprehensions
    "PIE",  # flake8-pie
    "PT",   # pytest style
    "RET",  # return simplification
    "PL",   # pylint (subset)
    "TID",  # tidy imports
]
ignore = [
    "E501",   # line length is handled by formatter
    "PLR0913",# too many arguments — acceptable in dataclass-heavy code
    "PLR2004",# magic value — we have legitimate sentinels
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # asserts are required for tests
    "PLR2004", # magic values in test fixtures
    "PLW0108", # lambda wrappers for single-use fake callables are idiomatic in tests
    "PLC0415", # lazy imports of pymupdf/fitz in helpers — top-level is fine but we keep them local for faster module-load
    "PT011",   # ValueError is the right type to expect in some unit tests
    "PT012",   # multi-line pytest.raises blocks are common in async tests
]
"scripts/**/*.py" = ["T201"]   # prints are fine in dev scripts

[tool.ruff.format]
docstring-code-format = true

# ============================================================================
# Mypy (strict types)
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "respx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed_extra = true
warn_required_dynamic_aliases = true

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: end-to-end tests that span modules",
    "unit: pure unit tests",
]
filterwarnings = [
    "error",
    'ignore::DeprecationWarning:botocore.*',
    'ignore::DeprecationWarning:s3transfer.*',
    # Unclosed sockets come from httpx.AsyncClient fixtures whose lifetime spans
    # event-loop boundaries; pytest-asyncio's loop teardown handles cleanup.
    'ignore::pytest.PytestUnraisableExceptionWarning',
    'ignore::ResourceWarning',
]

# ============================================================================
# Coverage (informational; CI runs separately)
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src/wactl"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
